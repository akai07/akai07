<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1d27;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect x="10" y="10" width="480" height="180" rx="16" fill="url(#bg-grad)" stroke="#2a2d3a" stroke-width="1.5"/>

  <!-- Top accent line -->
  <rect x="10" y="10" width="480" height="4" rx="2" fill="url(#accent-grad)"/>

  <!-- Inner glow -->
  <rect x="10" y="10" width="480" height="180" rx="16" fill="none" stroke="rgba(99,102,241,0.08)" stroke-width="1"/>

  <!-- THM Logo text -->
  <text x="250" y="60" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="22" fill="#6366F1" letter-spacing="3">TRYHACKME</text>

  <!-- Loading dots animation (static representation) -->
  <circle cx="210" cy="95" r="4" fill="#6366F1" opacity="0.4"/>
  <circle cx="230" cy="95" r="4" fill="#6366F1" opacity="0.6"/>
  <circle cx="250" cy="95" r="4" fill="#6366F1" opacity="0.8"/>
  <circle cx="270" cy="95" r="4" fill="#6366F1" opacity="0.6"/>
  <circle cx="290" cy="95" r="4" fill="#6366F1" opacity="0.4"/>

  <!-- Status text -->
  <text x="250" y="130" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="13" fill="#64748B">Syncing stats — updated daily via GitHub Actions</text>

  <!-- Username row -->
  <rect x="180" y="148" width="140" height="26" rx="13" fill="rgba(99,102,241,0.1)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <text x="250" y="165" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="12" fill="#94A3B8">@Akai07</text>
</svg>
