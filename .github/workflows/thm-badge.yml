name: Update TryHackMe Badge

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate TryHackMe badge
        uses: KeizerSec/Tryhackme-Badge@v1
        with:
          username: "Akai07"
          theme: "rotate"
          output-path: "assets/thm_badge.svg"
