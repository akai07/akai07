name: Update GitHub Stats Cards

on:
  schedule:
    - cron: '33 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub Stats SVG
        run: |
          curl -s -o assets/github-stats.svg "https://github-readme-stats.vercel.app/api?username=akai07&show_icons=true&count_private=true&hide_border=true&title_color=6366F1&icon_color=06B6D4&text_color=E2E8F0&bg_color=0D1117&include_all_commits=true&rank_icon=github&border_radius=16"

      - name: Fetch Top Languages SVG
        run: |
          curl -s -o assets/top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=akai07&layout=compact&hide_border=true&title_color=6366F1&text_color=E2E8F0&bg_color=0D1117&langs_count=8&border_radius=16"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          git diff --staged --quiet || git commit -m "chore: update github stats [skip ci]"
          git push
